services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleetops
      POSTGRES_PASSWORD: fleetops
      POSTGRES_DB: fleetops
    volumes:
      - fleetops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetops -d fleetops"]
      interval: 3s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://fleetops:fleetops@postgres:5432/fleetops
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-fleetops-dev-secret-change-me}
      HOST: 0.0.0.0
      PORT: 3000
      TZ: Asia/Dhaka
      PGHOST: postgres
      PGUSER: fleetops
      PGPASSWORD: fleetops
      PGDATABASE: fleetops
      INIT_DB: ${INIT_DB:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  fleetops_pg:
